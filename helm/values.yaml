global:
  cloudProvider: {}
  telemetry:
    tracing: {}
    logger:
      opentelemetryOptions: {}
  environment: {}
  db: {}
  ca:
    secretName: ''
    path: '/usr/local/share/ca-certificates'
    key: 'ca.crt'

mclabels:
  #environment: development
  component: backend
  partOf: core
  owner: raster
  gisDomain: raster
  prometheus:
    enabled: true
    port: 8080

enabled: true
environment: development
replicaCount: 1
initialDelaySeconds: 60
nodePort: 30030 # for minikube deployment only
resetOnConfigChange: true
imagePullPolicy: IfNotPresent

podAnnotations: {}

cloudProvider:
  dockerRegistryUrl: my-registry-url.io
  imagePullSecretName: 'my-registry-secret'
  flavor: openshift

image:
  repository: polygon-parts-manager
  tag: 'latest'

configManagement:
  offlineMode: true
  name: 'polygon-parts-manager'
  version: 'latest'
  serverUrl: ''

server:
  port: 80
  targetPort: 8080
  protocol: TCP
  responseCompressionEnabled: true
  requestPayloadLimit: 10mb

telemetry:
  logger:
    level: info
    prettyPrint: false
    # OpenTelemetry logging. Rendered into the configmap as OPENTELEMETRY_LOGGING_ENABLED,
    # OTLP_LOGGER_ENDPOINT_URL and, when resourceAttributes is set, OTEL_RESOURCE_ATTRIBUTES
    # as a key=value,key=value list. All three are mapped in
    # config/custom-environment-variables.json.
    # url can be overridden from global.telemetry.logger.opentelemetryOptions.url.
    opentelemetryOptions:
      enabled: true
      url: http://localhost:4317
      # Rendered as OTEL_RESOURCE_ATTRIBUTES in "key=value,key=value" format
      # resourceAttributes:
      #   service.namespace: namespace
      #   deployment.environment: dev
  tracing:
    enabled: true
    url: http://localhost:55681/v1/traces
application:
  chunkSize: 1000
  arraySeparator: ','
  createPolygonPartsTablesStoredProcedure: 'create_polygon_parts_tables'
  updatePolygonPartsTablesStoredProcedure: 'update_polygon_parts'
  createPolygonPartsValidationsTablesStoredProcedure: 'create_polygon_parts_validations_tables'
  validateSmallHolesFunction: 'validate_small_holes'
  validateSmallGeometriesFunction: 'validate_small_geometries'
  validateResolutionsFunction: 'validate_resolutions'
  entities:
    history:
      namePrefix: ''
      nameSuffix: '_history'
    polygonParts:
      find:
        maxDecimalDigits: 15
      intersection:
        maxDecimalDigits: 15
        minAreaSquareDeg: &intersectionMinAreaSquareDeg 1e-12
      namePrefix: ''
      nameSuffix: ''
      minAreaSquareDeg: 1e-12
    validations:
      namePrefix: ''
      nameSuffix: '_valid'
  aggregation:
    maxDecimalDigits: 12
    fixGeometry:
      enabled: true
      bufferSizeDeg: 0.000006
      bufferStyleParameters: >-
        'endcap=round join=round'
    simplifyGeometry:
      enabled: true
      toleranceDeg: 0.000006
  validation:
    areaThresholdSquareMeters: 10
    zoomLevelThreshold: 4
    resolution:
      minAreaSquareDeg: *intersectionMinAreaSquareDeg
# external
db:
  host: ''
  port: 5432
  username: ''
  password: ''
  name: ''
  schema: polygon_parts
  logging: false
  logNotifications: false
  applicationName: polygon_parts
  sslEnabled: false
  sslAuth:
    sslMountPath: /mnt/db/secrets
    certFileName: postgresql.crt
    keyFileName: postgresql.key
    caFileName: root.crt
  secrets:
    useExternal: false
    externalSecretName: ''

resources:
  enabled: true
  value:
    limits:
      cpu: 0.5
      memory: 0.5Gi
    requests:
      cpu: 0.25
      memory: 0.25Gi

route:
  enabled: false
  path: /
  timeout:
    enabled: false # defaults to 30s by openshift
    duration: 60s # supported units (us, ms, s, m, h, d)
  tls:
    useCerts: false
    certificate: ''
    key: ''
    caCertificate: ''

ingress:
  enabled: false
  type: 'nginx-org' # supported values: 'nginx-org' | 'nginx-kubernetes'
  path: /
  host: 'localhost'
  cors:
    enabled: true
    origin: '*'
